<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Optical Center</title>
<link rel="stylesheet" href="css/panel.css">
<script>
  /* Startup errors show as one plain line; details go to the debug console only. */
  window.onerror = function (msg, src, line) {
    try { console.info("[Optical Center] " + msg + " (" + String(src || "").split("/").pop() + ":" + line + ")"); } catch (e) {}
    var box = document.getElementById("status");
    if (box) { box.className = "status err"; box.textContent = "The panel didn't load properly. Close it and open it again."; }
    return true;
  };
</script>
</head>
<body>
  <header>
    <div class="eyebrow">JRO Design · Optical center</div>
    <p class="live" id="live">Select a shape and the shape to center it in.</p>
    <p class="hint hidden" id="textHint">Outline text for instant results.</p>
  </header>

  <button class="btn primary" id="goBoth" disabled>Optical center</button>
  <div class="two">
    <button class="btn" id="goH" disabled>Horizontal only</button>
    <button class="btn" id="goV" disabled>Vertical only</button>
  </div>

  <div class="status" id="status" role="status"></div>

  <details id="advanced">
    <summary><span class="eyebrow">Advanced</span></summary>

    <div class="block">
      <div class="eyebrow row"><span>Bias</span><span class="value"><span id="biasText">60</span>%</span></div>
      <div class="bias-row">
        <div class="slider">
          <div class="track"></div><div class="fill" id="fill"></div><div class="thumb" id="thumb"></div>
          <input type="range" id="bias" min="0" max="100" step="1" value="60" aria-label="Bias">
        </div>
        <input type="number" id="biasNum" min="0" max="100" step="1" value="60" aria-label="Bias percent">
      </div>
      <p class="hint">0% centers the bounding box. 100% centers the visual weight.</p>
    </div>

    <div class="block">
      <div class="eyebrow">Presets</div>
      <div class="chips" id="chips"></div>
      <div class="save-row">
        <input type="text" id="presetName" placeholder="Preset name" maxlength="40">
        <button class="btn small" id="savePreset">Save</button>
      </div>
    </div>

    <div class="block">
      <div class="eyebrow">Markers</div>
      <button class="btn small" id="preview" disabled>Preview markers</button>
      <div class="legend"><span class="box"><i></i>Box center</span><span class="opt"><i></i>Optical point</span></div>
    </div>

    <div class="block">
      <div class="eyebrow">Key object</div>
      <div class="keyrow">
        <button class="btn small" id="setKey">Set key</button>
        <button class="btn small ghost" id="clearKey">Clear</button>
      </div>
      <p class="hint" id="keyState">No key. The back-most object stays put.</p>
    </div>
  </details>

  <script src="js/CSInterface.js"></script>
  <script src="js/optical.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
